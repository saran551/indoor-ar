<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indoor AR Navigation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

/* HOME PAGE */
#home {
    min-height: 100vh;
    padding: 30px 20px;
    text-align: center;
}

h1 {
    margin-top: 50px;
}

.subtitle {
    color: #666;
    margin-bottom: 35px;
}

.searchBox {
    max-width: 450px;
    margin: auto;
}

input {
    width: 100%;
    padding: 16px;
    border: 1px solid #aaa;
    border-radius: 10px;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #1769ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

/* AR SCREEN */
#arScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 100;
}

#camera {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TOP */
#topInfo {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;

    padding: 14px;

    background: rgba(0,0,0,.70);
    color: white;

    border-radius: 12px;

    text-align: center;
    z-index: 5;
}

#title {
    font-size: 20px;
    font-weight: bold;
}

#step {
    margin-top: 6px;
    font-size: 15px;
}

/* AR ARROW */
#arrow {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 130px;

    color: #00ff55;

    font-weight: bold;

    text-shadow:
        0 0 10px black,
        0 0 25px black;

    transition: .4s;
}

/* BOTTOM */
#bottomInfo {
    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 20px;

    padding: 16px;

    background: rgba(0,0,0,.75);

    color: white;

    border-radius: 14px;

    text-align: center;
}

#instruction {
    font-size: 23px;
    font-weight: bold;
}

#location {
    margin-top: 7px;
    font-size: 14px;
}

/* CLOSE */
#close {
    position: absolute;

    right: 15px;
    top: 15px;

    width: auto;

    padding: 10px 15px;

    background: red;

    z-index: 10;
}

/* NEXT CHECKPOINT */
#next {
    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 100px;

    width: calc(100% - 40px);

    background: #1769ff;

    z-index: 10;
}
</style>
</head>


<body>

<!-- ================= HOME ================= -->

<div id="home">

    <h1>Indoor Navigation</h1>

    <div class="subtitle">
        HR Office → Electronics Lab
    </div>

    <div class="searchBox">

        <input
            id="search"
            type="text"
            placeholder="Search destination">

        <button onclick="startProject()">
            Start Navigation
        </button>

    </div>

</div>


<!-- ================= AR NAVIGATION ================= -->

<div id="arScreen">

    <!-- MOBILE CAMERA -->

    <video
        id="camera"
        autoplay
        playsinline>
    </video>


    <!-- CLOSE -->

    <button
        id="close"
        onclick="closeNavigation()">
        ✕
    </button>


    <!-- TOP INFORMATION -->

    <div id="topInfo">

        <div
