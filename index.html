<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Indoor Navigation</title>

  <!-- AR & 3D Web Libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui-container {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 85%;
      max-width: 380px;
    }
    select, button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    #qr-reader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
      background: black;
    }
  </style>
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div><strong>Location:</strong> <span id="start-node">Scan QR Code First</span></div>
    
    <label for="destination" style="margin-top: 8px; display:block;"><strong>Select Destination:</strong></label>
    <select id="destination">
      <option value="">-- Choose Target --</option>
      <option value="ELECTRONICS_LAB">Electronics Lab</option>
      <option value="CS_LAB">CS Lab</option>
      <option value="HOD_ROOM">HOD Room</option>
    </select>

    <button onclick="startNavigation()">Start Navigation</button>
  </div>

  <!-- QR Scanner Container -->
  <div id="qr-reader"></div>

  <!-- 3D Camera & AR Overlay -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Directional 3D Arrow Pointer -->
    <a-entity id="ar-arrow" position="0 -0.5 -2" visible="false">
      <a-cone color="#00FFFF" radius-bottom="0.4" radius-top="0" height="1.2" rotation="90 0 0"></a-cone>
    </a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // -------------------------------------------------------------
    // STEP 1: Graph Map Data Setup (Nodes & Edges)
    // -------------------------------------------------------------
    const mapData = {
      nodes: {
        "HR_OFFICE": { name: "HR Office" },
        "CORRIDOR_1": { name: "Corridor 1" },
        "ELECTRONICS_LAB": { name: "Electronics Lab" },
        "CS_LAB": { name: "CS Lab" },
        "HOD_ROOM": { name: "HOD Room" }
      },
      graph: {
        "HR_OFFICE": { "CORRIDOR_1": 1 },
        "CORRIDOR_1": { "HR_OFFICE": 1, "ELECTRONICS_LAB": 1, "CS_LAB": 2 },
        "ELECTRONICS_LAB": { "CORRIDOR_1": 1, "HOD_ROOM": 1 },
        "CS_LAB": { "CORRIDOR_1": 2 },
        "HOD_ROOM": { "ELECTRONICS_LAB": 1 }
      }
    };

    let currentStartNode = "";

    // -------------------------------------------------------------
    // STEP 2: QR Scanner Logic
    // -------------------------------------------------------------
    function onScanSuccess(decodedText) {
      // Assuming QR code text contains Node ID (e.g., "HR_OFFICE")
      if (mapData.nodes[decodedText]) {
        currentStartNode = decodedText;
        document.getElementById('start-node').innerText = mapData.nodes[decodedText].name;
        document.getElementById('qr-reader').style.display = 'none';
        html5QrcodeScanner.clear();
      } else {
        alert("Invalid QR Code for this map!");
      }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);

    // -------------------------------------------------------------
    // STEP 3: Dijkstra Shortest Path Algorithm
    // -------------------------------------------------------------
    function findShortestPath(graph, startNode, endNode) {
      let distances = {};
      let prev = {};
      let pq = new Set();

      for (let node in graph) {
        distances[node] = Infinity;
        prev[node] = null;
        pq.add(node);
      }
      distances[startNode] = 0;

      while (pq.size > 0) {
        let minNode = null;
        for (let node of pq) {
          if (minNode === null || distances[node] < distances[minNode]) {
            minNode = node;
          }
        }

        if (minNode === endNode || distances[minNode] === Infinity) break;
        pq.delete(minNode);

        for (let neighbor in graph[minNode]) {
          let alt = distances[minNode] + graph[minNode][neighbor];
          if (alt < distances[neighbor]) {
            distances[neighbor] = alt;
            prev[neighbor] = minNode;
          }
        }
      }

      let path = [];
      let curr = endNode;
      while (curr) {
        path.unshift(curr);
        curr = prev[curr];
      }
      return path;
    }

    // -------------------------------------------------------------
    // STEP 4: AR Navigation Launcher
    // -------------------------------------------------------------
    function startNavigation() {
      const dest = document.getElementById('destination').value;
      if (!currentStartNode) {
        alert("Please scan a QR code first!");
        return;
      }
      if (!dest) {
        alert("Please select a destination!");
        return;
      }

      const route = findShortestPath(mapData.graph, currentStartNode, dest);
      
      // Make 3D Arrow visible on camera
      const arrow = document.getElementById('ar-arrow');
      arrow.setAttribute('visible', 'true');

      alert("Route Calculated: " + route.join(" ➔ ") + "\nFollow the Cyan 3D Arrow!");
    }
  </script>
</body>
</html>
