<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Indoor AR Navigation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
}

#startScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background: white;
}

h1 {
    margin-bottom: 10px;
}

input {
    width: 100%;
    max-width: 350px;
    padding: 15px;
    font-size: 17px;
    border: 1px solid #aaa;
    border-radius: 10px;
}

button {
    width: 100%;
    max-width: 350px;
    margin-top: 12px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    background: #1769ff;
    color: white;
}

#arScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    overflow: hidden;
}

#camera {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Top information */
#info {
    position: absolute;
    top: 20px;
    left: 15px;
    right: 15px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(0,0,0,0.65);
    color: white;
    text-align: center;
    font-size: 18px;
}

/* Main AR arrow */
#arrow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px;
    color: #00ff55;
    text-shadow:
        0 0 10px black,
        0 0 25px black;
    animation: moveArrow 1s infinite;
}

@keyframes moveArrow {
    0% {
        transform: translate(-50%, -45%);
    }

    50% {
        transform: translate(-50%, -55%);
    }

    100% {
        transform: translate(-50%, -45%);
    }
}

/* Direction text */
#direction {
    position: absolute;
    bottom: 110px;
    left: 20px;
    right: 20px;
    padding: 15px;
    border-radius: 12px;
    background: rgba(0,0,0,0.7);
    color: white;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

/* Close button */
#closeBtn {
    position: absolute;
    top: 20px;
    right: 15px;
    width: auto;
    padding: 10px 15px;
    background: red;
    z-index: 10;
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">

    <h1>Indoor Navigation</h1>

    <p>HR Office → Elections Lab</p>

    <input
        id="destination"
        type="text"
        placeholder="Search destination">

    <button onclick="startNavigation()">
        Start Navigation
    </button>

</div>


<!-- AR CAMERA SCREEN -->

<div id="arScreen">

    <video
        id="camera"
        autoplay
        playsinline>
    </video>

    <button
        id="closeBtn"
        onclick="closeCamera()">
        ✕
    </button>

    <div id="info">
        HR Office → Elections Lab
    </div>

    <div id="arrow">
        ↑
    </div>

    <div id="direction">
        Go Straight
    </div>

</div>


<script>

let cameraStream = null;


async function startNavigation() {

    const destination =
        document
        .getElementById("destination")
        .value
        .toLowerCase()
        .trim();


    if (!destination.includes("election")) {

        alert(
            "Destination not found.\n\n" +
            "Try: Elections Lab"
        );

        return;
    }


    try {

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });


        const video =
            document.getElementById("camera");

        video.srcObject = cameraStream;


        document
        .getElementById("startScreen")
        .style.display = "none";


        document
        .getElementById("arScreen")
        .style.display = "block";


    }

    catch(error) {

        alert(
            "Camera permission denied.\n" +
            "Please allow camera access."
        );

    }

}


function closeCamera() {

    if (cameraStream) {

        cameraStream
        .getTracks()
        .forEach(track => track.stop());

        cameraStream = null;
    }


    document
    .getElementById("arScreen")
    .style.display = "none";


    document
    .getElementById("startScreen")
    .style.display = "flex";

}

</script>

</body>
</html>
