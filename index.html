<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indoor Navigation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.header {
    background: #1f2937;
    color: white;
    padding: 15px;
    text-align: center;
}

.search {
    padding: 15px;
    background: white;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
}

#map {
    position: relative;
    margin: 15px;
    height: 500px;
    background: white;
    border: 2px solid #aaa;
    overflow: hidden;
}

/* Walking path */
.path {
    position: absolute;
    height: 8px;
    background: #22c55e;
    border-radius: 10px;
    transform-origin: left center;
}

/* Route */
.route {
    position: absolute;
    height: 7px;
    background: red;
    border-radius: 10px;
    transform-origin: left center;
}

/* Location markers */
.marker {
    position: absolute;
    padding: 7px 10px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    font-size: 13px;
}

.hr {
    left: 30px;
    top: 420px;
    background: #dc2626;
}

.lab {
    right: 25px;
    top: 70px;
    background: #2563eb;
}

/* Arrow */
.arrow {
    position: absolute;
    font-size: 35px;
    color: red;
    transition: all 0.5s;
}

.camera {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 10;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.cameraArrow {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    color: red;
    text-shadow: 0 0 10px white;
}

.close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: auto;
    padding: 10px 15px;
    background: red;
    z-index: 20;
}
</style>
</head>

<body>

<div class="header">
    <h2>Indoor Navigation</h2>
    <p>HR Office → Elections Lab</p>
</div>

<div class="search">
    <input id="destination"
           type="text"
           placeholder="Search destination...">

    <button onclick="startNavigation()">
        Start Navigation
    </button>

    <button onclick="openCamera()">
        Open Camera Navigation
    </button>
</div>

<div id="map">

    <!-- Green walking paths -->
    <div class="path"
         style="left:50px; top:420px; width:300px; transform:rotate(-25deg);">
    </div>

    <div class="path"
         style="left:320px; top:290px; width:170px; transform:rotate(-55deg);">
    </div>

    <div class="path"
         style="left:420px; top:150px; width:150px; transform:rotate(-10deg);">
    </div>

    <!-- HR Office -->
    <div class="marker hr">
        HR Office
    </div>

    <!-- Elections Lab -->
    <div class="marker lab">
        Elections Lab
    </div>

    <!-- Route arrow -->
    <div id="arrow" class="arrow">➜</div>

</div>

<!-- Camera screen -->
<div id="cameraScreen" class="camera">

    <button class="close" onclick="closeCamera()">
        Close
    </button>

    <video id="camera" autoplay playsinline></video>

    <div class="cameraArrow">
        ↑
    </div>

</div>

<script>

function startNavigation() {

    let destination =
        document.getElementById("destination").value
        .toLowerCase();

    if (destination.includes("election")) {

        let arrow =
            document.getElementById("arrow");

        arrow.style.left = "300px";
        arrow.style.top = "250px";

        alert(
            "Route found!\nHR Office → Elections Lab"
        );

    } else {

        alert(
            "Destination not found.\nTry: Elections Lab"
        );
    }
}


async function openCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },
                audio: false
            });

        document.getElementById("camera").srcObject =
            stream;

        document.getElementById("cameraScreen")
            .style.display = "block";

    } catch (error) {

        alert(
            "Camera permission required."
        );
    }
}


function closeCamera() {

    let video =
        document.getElementById("camera");

    if (video.srcObject) {

        video.srcObject
            .getTracks()
            .forEach(track => track.stop());
    }

    document.getElementById("cameraScreen")
        .style.display = "none";
}

</script>

</body>
</html>
