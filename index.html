<!DOCTYPE html>
<html>
<head>
  <title>Google Live View AR Real-Time Navigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }

    #camera-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 55vh; z-index: 1; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    /* Top Google Live View Banner */
    #turn-banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: #1a73e8; color: white; padding: 12px 20px;
      border-radius: 30px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold; font-size: 14px; width: 92%; max-width: 400px;
    }
    #turn-icon { font-size: 22px; }

    /* GPS & Sensor Live Status */
    #live-status {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: rgba(0,0,0,0.75); color: #00ff66; padding: 5px 14px;
      border-radius: 15px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    }

    /* Bottom Map View */
    #map-view {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 45vh;
      background: #ffffff; z-index: 9999; border-top-left-radius: 20px;
      border-top-right-radius: 20px; overflow: hidden;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25); display: flex; flex-direction: column;
    }

    .map-wrapper {
      position: relative; width: 100%; height: 70%; background: #111;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    .map-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .user-dot {
      position: absolute; width: 22px; height: 22px; background: #1a73e8;
      border: 3px solid white; border-radius: 50%;
      box-shadow: 0 0 12px rgba(26, 115, 232, 0.8); top: 50%; left: 50%;
      transform: translate(-50%, -50%); animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(26, 115, 232, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0); }
    }

    #destination-card {
      height: 30%; background: #fff; border-top: 1px solid #e0e0e0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; color: #202124;
    }
    .card-info h3 { font-size: 15px; margin-bottom: 2px; color: #1a73e8; }
    .card-info p { font-size: 11px; color: #5f6368; }
  </style>
</head>
<body>

  <div id="turn-banner">
    <span id="turn-icon">↗️</span>
    <span id="turn-text">Walk 2m straight, then TURN RIGHT</span>
  </div>

  <div id="live-status">● Live Tracking Active (Compass & Motion)</div>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="map-view">
    <div class="map-wrapper">
      <img id="floor-img" src="1000395810.jpg" alt="Location" onerror="this.style.display='none'">
      <div class="user-dot"></div>
    </div>

    <div id="destination-card">
      <div class="card-info">
        <h3 id="card-title">Live Spot: Start Point</h3>
        <p id="card-sub">Auto Step Detection Active • Next: Corridor</p>
      </div>
    </div>
  </div>

  <script>
    // Live Camera Setup
    const video = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { console.error("Camera error", err); });

    // 3D ThreeJS Scene
    const canvas = document.getElementById('ar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight * 0.55);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight * 0.55), 0.1, 1000);
    camera.position.set(0, 1.2, 0);

    const pathGroup = new THREE.Group();
    scene.add(pathGroup);

    // 3D Blue Live Arrows
    const arrows = [];
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });

    for (let i = 0; i < 5; i++) {
      const arrowGroup = new THREE.Group();
      
      const coneGeo = new THREE.ConeGeometry(0.08, 0.2, 16);
      const cone = new THREE.Mesh(coneGeo, arrowMat);
      cone.rotation.x = -Math.PI / 2;
      cone.position.z = -0.1;
      arrowGroup.add(cone);

      const cylGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.15, 16);
      const cyl = new THREE.Mesh(cylGeo, arrowMat);
      cyl.rotation.x = -Math.PI / 2;
      cyl.position.z = 0.05;
      arrowGroup.add(cyl);

      arrowGroup.position.set(0, -0.4, -1.0 - (i * 0.8));
      pathGroup.add(arrowGroup);
      arrows.push(arrowGroup);
    }

    // Waypoint Data
    const waypoints = [
      {
        title: "Step 1: Start Point",
        sub: "Walk 2 meters & Turn Right",
        icon: "↗️",
        instruction: "Walk 2m straight, then TURN RIGHT",
        img: "1000395810.jpg",
        rotation: Math.PI / 4,
        distance: 2
      },
      {
        title: "Step 2: Corridor",
        sub: "Walk 12 meters along Corridor",
        icon: "⬆️",
        instruction: "Walk 12m along Corridor, then TURN LEFT",
        img: "1000395809.jpg",
        rotation: 0,
        distance: 12
      },
      {
        title: "Step 3: Electronics Lab Way",
        sub: "Walk 7 meters straight",
        icon: "↖️",
        instruction: "Walk 7m straight, then TURN LEFT for Lab Entrance",
        img: "1000395808.jpg",
        rotation: -Math.PI / 4,
        distance: 7
      },
      {
        title: "Step 4: Electronics Lab Entrance",
        sub: "Destination Reached!",
        icon: "📍",
        instruction: "ARRIVED: Electronics Lab",
        img: "1000396488.jpg",
        rotation: 0,
        distance: 0
      }
    ];

    let currentStep = 0;
    let stepCounter = 0;
    let lastAccel = 0;

    function updateNavigation() {
      const wp = waypoints[currentStep];
      document.getElementById('card-title').innerText = wp.title;
      document.getElementById('card-sub').innerText = wp.sub;
      document.getElementById('turn-icon').innerText = wp.icon;
      document.getElementById('turn-text').innerText = wp.instruction;
      
      const imgEl = document.getElementById('floor-img');
      imgEl.style.display = 'block';
      imgEl.src = wp.img;

      pathGroup.rotation.y = wp.rotation;
    }

    // Real-Time Pedometer / Walking Detection (Motion Sensor)
    window.addEventListener('devicemotion', (event) => {
      let acc = event.accelerationIncludingGravity;
      if (!acc) return;

      let totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      
      // Step detection threshold (~12 m/s2)
      if (totalAcc > 12.5 && (Date.now() - lastAccel > 600)) {
        lastAccel = Date.now();
        stepCounter++;

        // Every ~3 steps = 2 meters walking calculation
        let calculatedMeters = Math.max(0, waypoints[currentStep].distance - Math.floor(stepCounter * 0.7));
        
        if (calculatedMeters > 0) {
          document.getElementById('turn-text').innerText = `Walk ${calculatedMeters}m straight...`;
        } else {
          // Auto switch to next waypoint when target distance reached!
          if (currentStep < waypoints.length - 1) {
            currentStep++;
            stepCounter = 0;
            updateNavigation();
          }
        }
      }
    });

    // Real-time Compass Sensor
    window.addEventListener('deviceorientation', (event) => {
      if (event.alpha !== null) {
        let alpha = event.alpha;
        pathGroup.rotation.y = THREE.MathUtils.degToRad(-alpha) + waypoints[currentStep].rotation;
      }
    });

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let t = clock.getElapsedTime();

      arrows.forEach((arr, idx) => {
        let zPos = -1.0 - (idx * 0.8) + Math.sin(t * 3) * 0.08;
        arr.position.z = zPos;
      });

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight * 0.55);
      camera.aspect = window.innerWidth / (window.innerHeight * 0.55);
      camera.updateProjectionMatrix();
    });

    updateNavigation();
  </script>
</body>
</html>
