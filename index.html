
<!DOCTYPE html>
<html>
<head>
  <title>Google Live View AR Navigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }

    /* Top Camera View */
    #camera-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 50vh; z-index: 1; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    /* Floating Navigation Pill (Top Bar) */
    #nav-header {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: #1a73e8; color: white; padding: 8px 18px;
      border-radius: 30px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: 600; font-size: 14px;
    }
    select { background: transparent; border: none; color: white; font-size: 14px; font-weight: bold; outline: none; }

    /* Bottom Google Maps Split View */
    #map-view {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50vh;
      background: #ffffff; z-index: 9999; border-top-left-radius: 20px;
      border-top-right-radius: 20px; overflow: hidden;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25); display: flex; flex-direction: column;
    }

    .map-wrapper {
      position: relative; width: 100%; height: 75%; background: #e8eaed;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }

    .map-wrapper img { max-width: 95%; max-height: 95%; object-fit: contain; }

    /* Blue Location Pulsing Dot */
    .user-dot {
      position: absolute; width: 18px; height: 18px; background: #1a73e8;
      border: 3px solid white; border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(26, 115, 232, 0.3); top: 80%; left: 50%;
      transform: translate(-50%, -50%); animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(26, 115, 232, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0); }
    }

    .target-pin {
      position: absolute; padding: 6px 12px; background: #ea4335; color: white;
      border-radius: 12px; font-size: 11px; font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); top: 20%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Destination Card */
    #destination-card {
      height: 25%; background: #fff; border-top: 1px solid #e0e0e0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; color: #202124;
    }
    .card-info h3 { font-size: 15px; margin-bottom: 2px; }
    .card-info p { font-size: 11px; color: #5f6368; }
  </style>
</head>
<body>

  <div id="nav-header">
    <span>➔ Target:</span>
    <select id="destination" onchange="changeTarget()">
      <option value="electronics_lab">Electronics Lab</option>
      <option value="spot_2">CPPS Corridor / Way</option>
      <option value="spot_3">Main Reception / Entry</option>
      <option value="spot_4">CPPS Main Floor</option>
    </select>
  </div>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="map-view">
    <div class="map-wrapper">
      <img id="floor-plan-img" src="IMG_20260907_124812.jpg" alt="CPPS Map">
      <div class="user-dot"></div>
      <div id="target-pin" class="target-pin">Electronics Lab</div>
    </div>

    <div id="destination-card">
      <div class="card-info">
        <h3 id="card-title">Electronics Lab</h3>
        <p id="card-sub">CPPS Indoor Spot • Live AR Route Active</p>
      </div>
    </div>
  </div>

  <script>
    // 1. Webcam Setup
    const video = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { console.error("Camera access failed", err); });

    // 2. Three.js AR Path Setup
    const canvas = document.getElementById('ar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight / 2);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight / 2), 0.1, 1000);
    camera.position.set(0, 1.2, 0);

    // Glowing Animated Path Spheres (Like Google Live View)
    const spheres = [];
    const sphereGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });

    for (let i = 0; i < 5; i++) {
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.set(0, -0.3, -1.2 - (i * 0.8));
      scene.add(sphere);
      spheres.push(sphere);
    }

    // Floating Target Pin Box
    const boxGeo = new THREE.BoxGeometry(0.8, 0.3, 0.05);
    const boxMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });
    const targetBox = new THREE.Mesh(boxGeo, boxMat);
    targetBox.position.set(0, 0.3, -5.2);
    scene.add(targetBox);

    // Animation Loop (Pulse Spheres)
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let time = clock.getElapsedTime();

      spheres.forEach((s, idx) => {
        let scale = 1 + Math.sin(time * 4 - idx) * 0.3;
        s.scale.set(scale, scale, scale);
      });

      targetBox.position.y = 0.3 + Math.sin(time * 2) * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    // Responsive Resize
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight / 2);
      camera.aspect = window.innerWidth / (window.innerHeight / 2);
      camera.updateProjectionMatrix();
    });

    // Destination Switcher
    function changeTarget() {
      const dest = document.getElementById('destination').value;
      const pin = document.getElementById('target-pin');
      const title = document.getElementById('card-title');
      const img = document.getElementById('floor-plan-img');

      if (dest === 'electronics_lab') {
        title.innerText = "Electronics Lab"; pin.innerText = "Electronics Lab";
        img.src = "IMG_20260907_124812.jpg";
      } else if (dest === 'spot_2') {
        title.innerText = "CPPS Corridor / Way"; pin.innerText = "Corridor";
        img.src = "IMG_20260907_124840.jpg";
      } else if (dest === 'spot_3') {
        title.innerText = "Main Reception / Entry"; pin.innerText = "Reception";
        img.src = "IMG_20260907_124852.jpg";
      } else if (dest === 'spot_4') {
        title.innerText = "CPPS Main Floor"; pin.innerText = "Main Floor";
        img.src = "IMG_20260910_081343.jpg";
      }
    }
  </script>
</body>
</html>
