<!DOCTYPE html>
<html>
<head>
  <title>AR Indoor Factory Live Navigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }

    /* Top Camera AR View */
    #camera-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 50vh; z-index: 1; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    /* Google Live View Navigation Banner */
    #top-banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: #1a73e8; color: white; padding: 10px 18px;
      border-radius: 25px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold; font-size: 13px; width: 90%; max-width: 380px;
    }

    /* Bottom 2D Blueprint Map View */
    #map-container {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50vh;
      background: #111; z-index: 9999; border-top-left-radius: 20px;
      border-top-right-radius: 20px; overflow: hidden;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column;
    }

    #map-wrapper {
      position: relative; width: 100%; height: 80%; background: #fff; display: flex;
      justify-content: center; align-items: center; overflow: hidden;
    }

    #factory-map-img {
      position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1;
    }

    #blueprint-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
    }

    #info-card {
      height: 20%; background: #ffffff; border-top: 1px solid #e0e0e0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; color: #202124; z-index: 3;
    }
    .info-card h3 { font-size: 15px; color: #1a73e8; font-weight: 700; }
    .info-card p { font-size: 11px; color: #5f6368; }
  </style>
</head>
<body>

  <div id="top-banner">
    <span id="nav-icon">⬆️</span>
    <span id="nav-text">Walk straight from Entrance along Green Path</span>
  </div>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="map-container">
    <div id="map-wrapper">
      <img id="factory-map-img" src="1000396925.jpg" alt="Factory Blueprint">
      <canvas id="blueprint-canvas"></canvas>
    </div>
    
    <div id="info-card">
      <div>
        <h3 id="target-title">Target: Assembly Line / Panel Stores</h3>
        <p id="target-sub">Live Tracking Active • Green Path Selected</p>
      </div>
    </div>
  </div>

  <script>
    // 1. Live Camera Stream Setup
    const video = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => console.error("Camera Error:", err));

    // 2. Three.js AR View Setup
    const arCanvas = document.getElementById('ar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: arCanvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight * 0.50);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight * 0.50), 0.1, 1000);
    camera.position.set(0, 1.2, 0);

    const pathGroup = new THREE.Group();
    scene.add(pathGroup);

    // Floating 3D AR Navigation Balls (Video Style)
    const pathNodes = [];
    const nodeGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const nodeMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });

    for (let i = 0; i < 8; i++) {
      const node = new THREE.Mesh(nodeGeo, nodeMat);
      node.position.set(0, -0.4, -0.8 * (i + 1));
      pathGroup.add(node);
      pathNodes.push(node);
    }

    // 3. 2D Layout Map Canvas Tracking Overlay
    const mapCanvas = document.getElementById('blueprint-canvas');
    const mapCtx = mapCanvas.getContext('2d');

    function resizeMap() {
      mapCanvas.width = mapCanvas.clientWidth;
      mapCanvas.height = mapCanvas.clientHeight;
    }
    resizeMap();

    // Map Path Coordinates based on uploaded factory map image (Normalized 0.0 to 1.0)
    const pathPoints = [
      { x: 0.45, y: 0.77 }, // Red Circle Entrance (Office Building)
      { x: 0.45, y: 0.69 }, // Turn Point 1
      { x: 0.58, y: 0.69 }, // Main Corridor Green Line
      { x: 0.58, y: 0.42 }, // Turn Point 2 (Line 1 Corridor)
      { x: 0.58, y: 0.32 } // Target Point (Panel Stores / Assembly)
    ];

    let userProgress = 0; // 0 to 1 progress ratio

    function drawBlueprintOverlay() {
      mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
      const w = mapCanvas.width;
      const h = mapCanvas.height;

      // Draw Green Navigation Path Line
      mapCtx.strokeStyle = '#00e676';
      mapCtx.lineWidth = 5;
      mapCtx.lineCap = 'round';
      mapCtx.lineJoin = 'round';
      
      mapCtx.beginPath();
      mapCtx.moveTo(pathPoints[0].x * w, pathPoints[0].y * h);
      for (let i = 1; i < pathPoints.length; i++) {
        mapCtx.lineTo(pathPoints[i].x * w, pathPoints[i].y * h);
      }
      mapCtx.stroke();

      // Current Blue Dot Location Calculation along multi-segment path
      let segCount = pathPoints.length - 1;
      let totalProg = userProgress * segCount;
      let segIndex = Math.min(Math.floor(totalProg), segCount - 1);
      let segProg = totalProg - segIndex;

      let p1 = pathPoints[segIndex];
      let p2 = pathPoints[segIndex + 1];

      let currX = ((1 - segProg) * p1.x + segProg * p2.x) * w;
      let currY = ((1 - segProg) * p1.y + segProg * p2.y) * h;

      // Outer Pulsing Circle
      mapCtx.fillStyle = 'rgba(26, 115, 232, 0.3)';
      mapCtx.beginPath();
      mapCtx.arc(currX, currY, 14, 0, Math.PI * 2);
      mapCtx.fill();

      // Solid Live Blue Dot
      mapCtx.fillStyle = '#1a73e8';
      mapCtx.strokeStyle = '#ffffff';
      mapCtx.lineWidth = 3;
      mapCtx.beginPath();
      mapCtx.arc(currX, currY, 7, 0, Math.PI * 2);
      mapCtx.fill();
      mapCtx.stroke();
    }

    // 4. Motion Sensor Step Tracking
    let stepCount = 0;
    let lastAccel = 0;

    window.addEventListener('devicemotion', (e) => {
      let acc = e.accelerationIncludingGravity;
      if (!acc) return;

      let mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

      if (mag > 12.2 && (Date.now() - lastAccel > 500)) {
        lastAccel = Date.now();
        stepCount++;

        // ~35 steps complete green path journey
        userProgress = Math.min(1.0, stepCount / 35);

        if (userProgress < 0.25) {
          document.getElementById('nav-text').innerText = "Walk straight from Entrance along Green Path";
          document.getElementById('nav-icon').innerText = "⬆️";
          pathGroup.rotation.y = 0;
        } else if (userProgress < 0.50) {
          document.getElementById('nav-text').innerText = "Turn Right along Main Line Corridor";
          document.getElementById('nav-icon').innerText = "↗️";
          pathGroup.rotation.y = Math.PI / 4;
        } else if (userProgress < 0.85) {
          document.getElementById('nav-text').innerText = "Walk straight towards Panel Stores";
          document.getElementById('nav-icon').innerText = "⬆️";
          pathGroup.rotation.y = 0;
        } else {
          document.getElementById('nav-text').innerText = "Arrived at Target Area!";
          document.getElementById('nav-icon').innerText = "📍";
          document.getElementById('target-sub').innerText = "Destination Reached";
        }
      }
    });

    // Compass direction integration
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha !== null) {
        pathGroup.rotation.y = THREE.MathUtils.degToRad(-e.alpha);
      }
    });

    // Animation loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let t = clock.getElapsedTime();

      pathNodes.forEach((node, i) => {
        node.position.y = -0.4 + Math.sin(t * 4 + i * 0.4) * 0.04;
      });

      drawBlueprintOverlay();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight * 0.50);
      camera.aspect = window.innerWidth / (window.innerHeight * 0.50);
      camera.updateProjectionMatrix();
      resizeMap();
    });
  </script>
</body>
</html>
