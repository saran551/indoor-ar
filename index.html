<!DOCTYPE html>
<html>
<head>
  <title>Indoor AR Navigation</title>
  <!-- AR Libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    #ui-overlay {
      position: fixed; top: 15px; left: 15px; z-index: 9999;
      background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 10px; color: #fff;
      font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    select, button {
      padding: 8px 12px; margin-top: 8px; border-radius: 5px; border: none; font-size: 14px;
    }
    button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- UI Overlay for Selecting Destination -->
  <div id="ui-overlay">
    <label for="destination"><b>Select Location:</b></label><br>
    <select id="destination">
      <option value="elections_lab">Elections Lab</option>
      <option value="hroffice">hroffice</option>
      <option value="store">store</option>
    </select>
    <button onclick="startNavigation()">Go</button>
  </div>

  <!-- AR Camera Scene -->
  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- 3D Directional Arrow -->
    <a-entity id="ar-arrow" position="0 -0.5 -2" rotation="0 0 0" visible="false">
      <a-cone color="#00FFFF" radius-bottom="0.25" radius-top="0" height="0.8" rotation="90 0 0"></a-cone>
    </a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    function startNavigation() {
      const dest = document.getElementById('destination').value;
      const arrow = document.getElementById('ar-arrow');
      
      arrow.setAttribute('visible', 'true');
      
      // Dynamic Direction Logic
      if(dest === 'elections_lab') {
        arrow.setAttribute('rotation', '0 -45 0'); // Point Left
      } else if(dest === 'hroffice') {
        arrow.setAttribute('rotation', '0 45 0');  // Point Right
      } else if(dest === 'store') {
        arrow.setAttribute('rotation', '0 0 0');   // Straight Ahead
      }
    }
  </script>
</body>
</html>
