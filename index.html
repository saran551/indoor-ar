
<!DOCTYPE html>
<html>
<head>
  <title>Electronics Lab Live Navigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }

    #camera-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 52vh; z-index: 1; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    /* Top Google Banner Instruction */
    #turn-banner {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: #1b5e20; color: white; padding: 12px 20px;
      border-radius: 30px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold; font-size: 15px; width: 90%; max-width: 400px;
    }
    #turn-icon { font-size: 24px; }

    /* Step Navigation Controls */
    #nav-controls {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; gap: 10px;
    }
    .step-btn {
      background: #1a73e8; color: white; border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Bottom Map Split View */
    #map-view {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 48vh;
      background: #ffffff; z-index: 9999; border-top-left-radius: 20px;
      border-top-right-radius: 20px; overflow: hidden;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25); display: flex; flex-direction: column;
    }

    .map-wrapper {
      position: relative; width: 100%; height: 75%; background: #111;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    .map-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .user-dot {
      position: absolute; width: 22px; height: 22px; background: #1a73e8;
      border: 3px solid white; border-radius: 50%;
      box-shadow: 0 0 12px rgba(26, 115, 232, 0.8); top: 80%; left: 50%;
      transform: translate(-50%, -50%); animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(26, 115, 232, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0); }
    }

    #destination-card {
      height: 25%; background: #fff; border-top: 1px solid #e0e0e0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; color: #202124;
    }
    .card-info h3 { font-size: 15px; margin-bottom: 2px; }
    .card-info p { font-size: 11px; color: #5f6368; }
  </style>
</head>
<body>

  <!-- Live Turn Instructions Banner -->
  <div id="turn-banner">
    <span id="turn-icon">⬆️</span>
    <span id="turn-text">Walk 2 meters straight</span>
  </div>

  <div id="nav-controls">
    <button class="step-btn" onclick="prevStep()">◀ Back</button>
    <button class="step-btn" onclick="nextStep()">Next Waypoint ▶</button>
  </div>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="map-view">
    <div class="map-wrapper">
      <img id="floor-img" src="1000395810.jpg" alt="Current Location">
      <div class="user-dot"></div>
    </div>

    <div id="destination-card">
      <div class="card-info">
        <h3 id="card-title">Step 1: Start Point</h3>
        <p id="card-sub">Destination: Electronics Lab • Total distance ~21m</p>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { console.error("Camera error", err); });

    const canvas = document.getElementById('ar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight * 0.52);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight * 0.52), 0.1, 1000);
    camera.position.set(0, 1.2, 0);

    const pathGroup = new THREE.Group();
    scene.add(pathGroup);

    // Create 3D Blue Live View Arrows
    const arrows = [];
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });

    for (let i = 0; i < 5; i++) {
      const arrowGroup = new THREE.Group();
      
      const coneGeo = new THREE.ConeGeometry(0.08, 0.2, 16);
      const cone = new THREE.Mesh(coneGeo, arrowMat);
      cone.rotation.x = -Math.PI / 2;
      cone.position.z = -0.1;
      arrowGroup.add(cone);

      const cylGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.15, 16);
      const cyl = new THREE.Mesh(cylGeo, arrowMat);
      cyl.rotation.x = -Math.PI / 2;
      cyl.position.z = 0.05;
      arrowGroup.add(cyl);

      arrowGroup.position.set(0, -0.4, -1.0 - (i * 0.8));
      pathGroup.add(arrowGroup);
      arrows.push(arrowGroup);
    }

    // Dynamic Waypoint Data Configuration based on uploaded images
    const waypoints = [
      {
        title: "Step 1: Start Point",
        sub: "Walk 2 meters & Turn Right",
        icon: "↗️",
        instruction: "Walk 2m straight, then TURN RIGHT",
        img: "1000395810.jpg",
        rotation: Math.PI / 4 // Angled to Right
      },
      {
        title: "Step 2: Corridor",
        sub: "Walk 12 meters straight",
        icon: "⬆️",
        instruction: "Walk 12m along Corridor, then TURN LEFT",
        img: "1000395809.jpg",
        rotation: 0 // Straight ahead
      },
      {
        title: "Step 3: Electronics Lab Way",
        sub: "Walk 7 meters straight",
        icon: "↖️",
        instruction: "Walk 7m straight, then TURN LEFT for Lab Entrance",
        img: "1000395808.jpg",
        rotation: -Math.PI / 4 // Angled to Left
      },
      {
        title: "Step 4: Electronics Lab",
        sub: "You have arrived at your destination!",
        icon: "📍",
        instruction: "ARRIVED: Electronics Lab Entrance",
        img: "1000396488.jpg",
        rotation: 0
      }
    ];

    let currentStep = 0;

    function updateNavigation() {
      const wp = waypoints[currentStep];
      document.getElementById('card-title').innerText = wp.title;
      document.getElementById('card-sub').innerText = wp.sub;
      document.getElementById('turn-icon').innerText = wp.icon;
      document.getElementById('turn-text').innerText = wp.instruction;
      document.getElementById('floor-img').src = wp.img;

      // Rotate AR arrows toward turn direction
      pathGroup.rotation.y = wp.rotation;
    }

    function nextStep() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        updateNavigation();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateNavigation();
      }
    }

    // Compass Sensor Dynamic Bearing
    window.addEventListener('deviceorientation', (event) => {
      if (event.alpha !== null && currentStep === 1) { // Apply compass on corridor walk
        let alpha = event.alpha;
        pathGroup.rotation.y = THREE.MathUtils.degToRad(-alpha);
      }
    });

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let t = clock.getElapsedTime();

      arrows.forEach((arr, idx) => {
        let zPos = -1.0 - (idx * 0.8) + Math.sin(t * 3) * 0.08;
        arr.position.z = zPos;
      });

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight * 0.52);
      camera.aspect = window.innerWidth / (window.innerHeight * 0.52);
      camera.updateProjectionMatrix();
    });

    updateNavigation();
  </script>
</body>
</html>
