<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indoor AR Navigation</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background: #000; overflow: hidden; }

    /* Setup Box */
    #card-ui {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 85%; max-width: 350px;
      background: white; padding: 20px;
      border-radius: 12px; text-align: center;
      z-index: 1000;
    }

    #qr-reader { width: 100%; margin: 10px 0; }

    /* Nav Top Overlay */
    #nav-bar {
      display: none; position: fixed; top: 10px; left: 5%; width: 90%;
      background: rgba(0, 0, 0, 0.85); color: #fff;
      padding: 12px; border-radius: 10px; font-size: 14px; z-index: 500;
    }

    /* Live Camera Container */
    #camera-feed { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }

    /* 2D Floor Map Overlay Canvas */
    #map-canvas {
      display: none; position: fixed; bottom: 20px; right: 20px;
      width: 140px; height: 140px; background: rgba(255, 255, 255, 0.9);
      border: 2px solid #007bff; border-radius: 10px; z-index: 500;
    }

    /* 3D Dynamic Direction Arrow Overlay */
    #ar-arrow-overlay {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 400; text-align: center;
    }

    .arrow-pointer {
      width: 0; height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 50px solid #00ffff;
      margin: 0 auto;
      filter: drop-shadow(0px 0px 8px #00ffff);
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    select, button {
      width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc;
    }
    button { background: #007bff; color: white; font-weight: bold; border: none; }
  </style>
</head>
<body>

  <!-- Camera Stream -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Step 1 UI Box -->
  <div id="card-ui">
    <h3>AR Map Navigation</h3>
    <div id="status">Scan <b>HR_OFFICE</b> QR Code</div>
    <div id="qr-reader"></div>

    <div id="dest-box" style="display:none;">
      <select id="destination">
        <option value="ELECTRONICS_LAB">Electronics Lab</option>
      </select>
      <button onclick="startNavigation()">Start Navigation</button>
    </div>
  </div>

  <!-- Step 2 UI Guidance Top Bar -->
  <div id="nav-bar">
    <div id="step-text"><b>Step 1:</b> Walk Straight 7m to Entrance</div>
  </div>

  <!-- 3D Arrow Canvas Overlay -->
  <div id="ar-arrow-overlay">
    <div class="arrow-pointer"></div>
    <div style="color:#00ffff; font-weight:bold; margin-top:8px;">STRAIGHT</div>
  </div>

  <!-- 2D Live Route Minimap Canvas -->
  <canvas id="map-canvas" width="140" height="140"></canvas>

  <script>
    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
      if (decodedText.trim() === "HR_OFFICE") {
        document.getElementById('status').innerHTML = "<b style='color:green;'>Location: HR Office</b>";
        html5QrcodeScanner.clear();
        document.getElementById('qr-reader').style.display = 'none';
        document.getElementById('dest-box').style.display = 'block';
      } else {
        alert("Scan correct HR_OFFICE QR code!");
      }
    }

    html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 200 });
    html5QrcodeScanner.render(onScanSuccess);

    function startNavigation() {
      document.getElementById('card-ui').style.display = 'none';
      document.getElementById('nav-bar').style.display = 'block';
      document.getElementById('ar-arrow-overlay').style.display = 'block';
      document.getElementById('map-canvas').style.display = 'block';

      // Open Back Camera
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          document.getElementById('camera-feed').srcObject = stream;
        });

      // Draw 2D Floor Layout Map
      drawFloorMap();
    }

    function drawFloorMap() {
      const canvas = document.getElementById('map-canvas');
      const ctx = canvas.getContext('2d');

      // Clear
      ctx.clearRect(0, 0, 140, 140);

      // Draw Path (HR Office -> Entrance -> Corridor -> Lab)
      ctx.beginPath();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#007bff";
      ctx.moveTo(20, 120); // HR Office
      ctx.lineTo(20, 60); // Entrance (7m straight)
      ctx.lineTo(100, 60); // Right turn (13m)
      ctx.lineTo(100, 20); // Left turn (6m)
      ctx.lineTo(70, 20); // Left turn (3m - Lab)
      ctx.stroke();

      // Start Point Marker (HR)
      ctx.fillStyle = "red";
      ctx.beginPath(); ctx.arc(20, 120, 6, 0, Math.PI * 2); ctx.fill();

      // Destination Marker (Electronics Lab)
      ctx.fillStyle = "green";
      ctx.beginPath(); ctx.arc(70, 20, 6, 0, Math.PI * 2); ctx.fill();
    }
  </script>
</body>
</html>
