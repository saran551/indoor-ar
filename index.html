<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Indoor Navigation</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; }

    /* Live Camera Stream Background */
    #camera-feed {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    /* 3D AR Layer View */
    #ar-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none;
    }

    /* Top HUD Navigation Bar */
    #hud-panel {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 10; width: 90%; max-width: 400px;
      background: rgba(0, 0, 0, 0.85); color: #00ffff; padding: 12px;
      border-radius: 12px; border: 1.5px solid #00ffff; font-size: 13px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,255,255,0.3);
    }

    /* Bottom 2D Minimap Canvas Overlay */
    #minimap-card {
      position: fixed; bottom: 20px; right: 20px;
      z-index: 10; background: rgba(0, 0, 0, 0.85); padding: 6px; border-radius: 10px;
      border: 2px solid #00ffff; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    #minimap-canvas { display: block; border-radius: 6px; }

    /* Destination Reached Alert Popup */
    #success-popup {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 200; background: white; padding: 25px; border-radius: 16px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 80%; max-width: 300px; color: #222;
    }

    .btn-action {
      margin-top: 15px; padding: 10px 20px; background: #00838f; color: white;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <video id="camera-feed" autoplay playsinline muted></video>

  <canvas id="ar-canvas"></canvas>

  <div id="hud-panel">
    <div style="font-size:14px; font-weight:bold; color:#fff; margin-bottom:3px;">HR Office ➔ Electronics Lab</div>
    <div id="route-step">Walk Straight 7m ➔ Turn Right 13m ➔ Turn Left 6m ➔ Left 3m</div>
  </div>

  <div id="minimap-card">
    <canvas id="minimap-canvas" width="160" height="100"></canvas>
  </div>

  <div id="success-popup">
    <h3 style="color:#222; font-size:16px;">You have reached Electronics Lab!</h3>
    <button class="btn-action" onclick="location.reload()">Restart Route</button>
  </div>

  <script>
    let scene, camera, renderer;
    let userProgress = 0;

    // 1. Automatic Camera Start on Link Open
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { document.getElementById('camera-feed').srcObject = stream; })
      .catch(() => {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(stream => { document.getElementById('camera-feed').srcObject = stream; });
      });

    // 2. Initialize 3D AR Scene
    function init3DScene() {
      const canvas = document.getElementById('ar-canvas');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Floor Waypoints (7m -> Right 13m -> Left 6m -> Left 3m)
      const waypoints = [
        new THREE.Vector3(0, -1, -2),
        new THREE.Vector3(0, -1, -8),
        new THREE.Vector3(5, -1, -8),
        new THREE.Vector3(5, -1, -12),
        new THREE.Vector3(3, -1, -12)
      ];

      const arrowGroup = new THREE.Group();

      for (let i = 0; i < waypoints.length - 1; i++) {
        let start = waypoints[i];
        let end = waypoints[i + 1];
        let count = 4;

        for (let j = 0; j < count; j++) {
          let t = j / count;
          let pos = new THREE.Vector3().lerpVectors(start, end, t);

          const shape = new THREE.Shape();
          shape.moveTo(0, 0.35);
          shape.lineTo(-0.2, -0.25);
          shape.lineTo(-0.08, -0.15);
          shape.lineTo(-0.08, -0.5);
          shape.lineTo(0.08, -0.5);
          shape.lineTo(0.08, -0.15);
          shape.lineTo(0.2, -0.25);
          shape.closePath();

          const geom = new THREE.ShapeGeometry(shape);
          const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
          const mesh = new THREE.Mesh(geom, mat);

          mesh.rotation.x = -Math.PI / 2;
          mesh.position.copy(pos);

          let dir = new THREE.Vector3().subVectors(end, start).normalize();
          mesh.rotation.z = Math.atan2(dir.x, dir.z);

          arrowGroup.add(mesh);
        }
      }

      scene.add(arrowGroup);
      camera.position.set(0, 1.5, 0);

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    }

    // 3. Render Live 2D Minimap
    function renderMinimap() {
      const cvs = document.getElementById('minimap-canvas');
      const ctx = cvs.getContext('2d');

      ctx.clearRect(0, 0, 160, 100);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 2;
      ctx.strokeRect(5, 5, 150, 90);

      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#00ffff";
      
      const points = [
        {x: 20, y: 80}, {x: 20, y: 25}, {x: 100, y: 25}, {x: 100, y: 65}, {x: 135, y: 65}
      ];

      ctx.moveTo(points[0].x, points[0].y);
      for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();

      let total = points.length - 1;
      let scaled = userProgress * total;
      let idx = Math.floor(scaled);
      let t = scaled - idx;

      if (idx >= total) { idx = total - 1; t = 1; }

      let curX = points[idx].x + (points[idx+1].x - points[idx].x) * t;
      let curY = points[idx].y + (points[idx+1].y - points[idx].y) * t;

      ctx.fillStyle = "#00bcd4";
      ctx.beginPath();
      ctx.arc(curX, curY, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Start 3D AR Scene & Live Walking Tracker
    init3DScene();

    let walkInterval = setInterval(() => {
      if (userProgress < 1.0) {
        userProgress += 0.01;
        renderMinimap();
      } else {
        clearInterval(walkInterval);
        document.getElementById('success-popup').style.display = 'block';
      }
    }, 250);
  </script>
</body>
</html>
