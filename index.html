<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Indoor AR Navigation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

/* HOME */

#home {
    min-height: 100vh;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-top: 30px;
}

.subtitle {
    text-align: center;
    color: #666;
}

.searchBox {
    max-width: 450px;
    margin: 35px auto;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #1769ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

/* CAMERA */

#navigation {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 100;
}

#camera {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#topBar {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(0,0,0,.65);
    color: white;
    text-align: center;
    z-index: 5;
}

#destinationName {
    font-size: 20px;
    font-weight: bold;
}

#stepText {
    margin-top: 5px;
    font-size: 15px;
}

/* AR ARROW */

#arArrow {
    position: absolute;
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 125px;
    font-weight: bold;

    color: #00ff55;

    text-shadow:
        0 0 8px black,
        0 0 20px black;

    transition:
        transform .4s ease;
}

/* bottom */

#bottomBar {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 20px;

    padding: 15px;

    border-radius: 14px;

    background: rgba(0,0,0,.7);
    color: white;

    text-align: center;
}

#direction {
    font-size: 24px;
    font-weight: bold;
}

#checkpoint {
    margin-top: 5px;
    font-size: 14px;
}

/* close */

#close {
    position: absolute;
    right: 15px;
    top: 15px;

    width: auto;

    padding: 9px 14px;

    background: red;

    z-index: 10;
}

/* QR */

#qrBox {
    margin-top: 20px;
    text-align: center;
    color: #555;
}
</style>
</head>

<body>


<!-- HOME SCREEN -->

<section id="home">

    <h1>Indoor Navigation</h1>

    <div class="subtitle">
        Company Indoor Navigation System
    </div>

    <div class="searchBox">

        <input
            id="search"
            type="text"
            placeholder="Search destination...">

        <button onclick="findDestination()">
            Search
        </button>

        <div id="qrBox">
            Scan the location QR to start navigation
        </div>

    </div>

</section>


<!-- NAVIGATION SCREEN -->

<section id="navigation">

    <video
        id="camera"
        autoplay
        playsinline>
    </video>

    <button
        id="close"
        onclick="stopNavigation()">
        ✕
    </button>

    <div id="topBar">

        <div id="destinationName">
            Electronics Lab
        </div>

        <div id="stepText">
            HR Office → Electronics Lab
        </div>

    </div>


    <div id="arArrow">
        ↑
    </div>


    <div id="bottomBar">

        <div id="direction">
            GO STRAIGHT
        </div>

        <div id="checkpoint">
            Starting from HR Office
        </div>

    </div>

</section>


<script>

/*
====================================================
INDOOR ROUTE DATA
====================================================

HR Office → Electronics Lab

Each checkpoint represents one position
inside the company.

Later we will replace these example checkpoints
with the exact points from your green path.
*/

const route = [

    {
        id: "HR",
        name: "HR Office",
        direction: "straight",
        text: "Start from HR Office"
    },

    {
        id: "P1",
        name: "Path 1",
        direction: "straight",
        text: "Go straight"
    },

    {
        id: "P2",
        name: "Junction",
        direction: "right",
        text: "Turn RIGHT"
    },

    {
        id: "P3",
        name: "Path 2",
        direction: "straight",
        text: "Go straight"
    },

    {
        id: "P4",
        name: "Path 3",
        direction: "left",
        text: "Turn LEFT"
    },

    {
        id: "EL",
        name: "Electronics Lab",
        direction: "destination",
        text: "You reached Electronics Lab"
    }

];


let currentStep = 0;
let cameraStream = null;


/*
====================================================
DESTINATION SEARCH
====================================================
*/

function findDestination() {

    const value =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    if (
        value === "electronics lab" ||
        value.includes("electronics")
    ) {

        currentStep = 0;

        startNavigation();

    } else {

        alert(
            "Destination not found.\n\n" +
            "Available destination:\n" +
            "Electronics Lab"
        );

    }

}


/*
====================================================
START CAMERA NAVIGATION
====================================================
*/

async function startNavigation() {

    try {

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });


        document
        .getElementById("camera")
        .srcObject = cameraStream;


        document
        .getElementById("home")
        .style.display = "none";


        document
        .getElementById("navigation")
        .style.display = "block";


        updateNavigation();

    }

    catch(error) {

        alert(
            "Camera permission required.\n\n" +
            "Please allow camera access."
        );

    }

}


/*
====================================================
UPDATE AR DIRECTION
====================================================
*/

function updateNavigation() {

    const step = route[currentStep];

    const arrow =
        document.getElementById("arArrow");

    const direction =
        document.getElementById("direction");

    const checkpoint =
        document.getElementById("checkpoint");


    document
    .getElementById("stepText")
    .innerText =
        "HR Office → Electronics Lab";


    checkpoint.innerText =
        step.name;


    /*
    STRAIGHT
    */

    if (step.direction === "straight") {

        arrow.innerText = "↑";

        arrow.style.transform =
            "translate(-50%, -50%) rotate(0deg)";

        direction.innerText =
            "GO STRAIGHT";

    }


    /*
    RIGHT
    */

    else if (step.direction === "right") {

        arrow.innerText = "→";

        arrow.style.transform =
            "translate(-50%, -50%)";

        direction.innerText =
            "TURN RIGHT";

    }


    /*
    LEFT
    */

    else if (step.direction === "left") {

        arrow.innerText = "←";

        arrow.style.transform =
            "translate(-50%, -50%)";

        direction.innerText =
            "TURN LEFT";

    }


    /*
    DESTINATION
    */

    else if (step.direction === "destination") {

        arrow.innerText = "✓";

        arrow.style.transform =
            "translate(-50%, -50%)";

        direction.innerText =
            "YOU REACHED ELECTRONICS LAB";

        checkpoint.innerText =
            "Destination reached";

    }

}


/*
====================================================
QR CHECKPOINT SYSTEM
====================================================

Example QR URLs:

?point=HR
?point=P1
?point=P2
?point=P3
?point=P4
?point=EL

When QR is scanned, the app can identify
the user's current checkpoint.
*/

function readQRPoint() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const point =
        params.get("point");


    if (!point) {
        return;
    }


    const index =
        route.findIndex(
            item => item.id === point
        );


    if (index !== -1) {

        currentStep = index;

        updateNavigation();

    }
